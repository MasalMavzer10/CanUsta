<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#10202e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CAN USTA — Mutfak Devriyesi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Oyun 480x270 iç çözünürlükte çizilir ve ekranın tamamına yayılır. -->
  <div id="stage">
    <canvas id="game" width="480" height="270" tabindex="0"
            aria-label="Can Usta Mutfak Devriyesi oyunu"></canvas>
  </div>

  <!-- Telefonda aynı anda koşma, eğilme ve doğrama için çoklu dokunmatik. -->
  <div id="mobile-controls" aria-label="Dokunmatik oyun kumandası">
    <div class="touch-system" role="group" aria-label="Oyun seçenekleri">
      <button id="joystick-sensitivity" class="touch-btn touch-mini touch-sensitivity"
              type="button" data-actions="sensitivity" aria-label="Joystick hassasiyeti normal">N</button>
      <button class="touch-btn touch-mini" type="button" data-actions="fullscreen" aria-label="Tam ekran">&#x26F6;</button>
      <button class="touch-btn touch-mini" type="button" data-actions="pause" aria-label="Duraklat">&#10074;&#10074;</button>
      <button class="touch-btn touch-mini" type="button" data-actions="retry" aria-label="Tekrar dene">&#8635;</button>
    </div>

    <div id="joystick-zone" class="joystick-zone" role="application"
         aria-label="Hareket joysticki: sağ sol yürü, yukarı zıpla, aşağı eğil">
      <div id="joystick-base" class="joystick-base" aria-hidden="true">
        <span class="joystick-arrow joystick-arrow-up">&#9650;</span>
        <span class="joystick-arrow joystick-arrow-down">&#9660;</span>
        <span class="joystick-arrow joystick-arrow-left">&#9664;</span>
        <span class="joystick-arrow joystick-arrow-right">&#9654;</span>
        <div id="joystick-knob" class="joystick-knob"></div>
        <small id="joystick-label" class="joystick-label">NORMAL</small>
      </div>
    </div>

    <div class="touch-action" role="group" aria-label="Eylem">
      <button id="touch-secondary" class="touch-btn touch-secondary" hidden
              type="button" data-actions="dismiss" aria-label="İkincil eylem">
        <strong>İŞTEN ÇIKAR</strong>
      </button>
      <button class="touch-btn touch-main" type="button" data-actions="chop use" aria-label="Başla">
        <strong>BAŞLA</strong><small>EYLEM</small>
      </button>
    </div>
  </div>

  <div id="rotate-device" role="status">
    <span>&#8635;</span>
    <strong>TELEFONU YAN ÇEVİR</strong>
    <small>Can Usta geniş ekranda daha rahat oynanır.</small>
  </div>

  <!-- Tuş listesi. Düz DOM, tuvale hiç yük bindirmiyor. -->
  <footer id="legend">
    <span><b>A</b> <b>D</b> yürü</span>
    <span><b>W</b> zıpla</span>
    <span><b>S</b> eğil</span>
    <span><b>S BASILI TUT</b> alttan geç</span>
    <span><b>SPACE</b> yakala <i>(1. perde)</i> &middot; kullan <i>(2. perde)</i></span>
    <span><b>S + SPACE</b> tabağı at</span>
    <span><b>X</b> işten çıkar <i>(maaş günü)</i></span>
    <span><b>O</b> tekrar</span>
    <span><b>P</b> duraklat</span>
  </footer>

  <script src="game.js"></script>
</body>
</html>
